name: Diagnose first boot log
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-boot-log.yml"
      - "Logs/boot-1.zip"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract focused boot diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, re, zipfile
          from pathlib import Path

          archive = Path("Logs/boot-1.zip")
          report = []
          with zipfile.ZipFile(archive) as z:
              infos = [x for x in z.infolist() if not x.is_dir()]
              report += [f"ARCHIVE: {archive} ({archive.stat().st_size:,} bytes)", f"MEMBERS: {len(infos)}"]
              report += [f"{x.filename} | {x.file_size:,} bytes" for x in infos]
              def read(name):
                  try:
                      return z.read(name).decode("utf-8", errors="replace")
                  except KeyError:
                      return ""
              for name in ("boot-1/hw.txt", "boot-1/hwdetect.txt"):
                  report += ["", f"===== FULL {name} =====", read(name)[:20000]]
              stage = read("boot-1/stage0-dmesg.txt").splitlines()
              report += ["", "===== STAGE0: GPU / STORAGE / BOOT ERRORS ====="]
              rx = re.compile(r"gbos-stage0|i915|drm|firmware|error|failed|fail |panic|oops|fatal|super\.img|mount|avc: denied", re.I)
              for i, line in enumerate(stage):
                  if rx.search(line):
                      report.append(f"{i+1}: {line[:1000]}")
              crash = read("boot-1/crash.txt")
              blocks = re.split(r"(?=--------- beginning of crash)", crash)
              signals = collections.Counter(re.findall(r"Fatal signal \d+ \(([^)]+)\).*?\((?:[A-Z_]+)\).*?in tid \d+ \(([^)]+)\)", crash))
              report += ["", f"===== CRASH SUMMARY: {len(blocks)-1} crash sections ====="]
              report += [f"{count}x signal={sig} process/thread={proc}" for (sig, proc), count in signals.most_common(30)]
              report += ["", "===== FIRST 4 CRASH SECTIONS (up to 100 lines each) ====="]
              for block in [b for b in blocks if "Fatal signal" in b][:4]:
                  lines = block.splitlines()
                  report.append("---")
                  report.extend(f"{i+1}: {line[:1000]}" for i, line in enumerate(lines[:100]))
              # Search the logcat rotations without printing their enormous full contents.
              logcat_names = [x.filename for x in infos if re.fullmatch(r"boot-1/logcat\.txt(?:\.\d+)?", x.filename)]
              logcat_hits = []
              avc_counts = collections.Counter()
              for name in logcat_names:
                  data = read(name)
                  if not data:
                      continue
                  for i, line in enumerate(data.splitlines()):
                      if "avc: denied" in line.lower():
                          key = re.sub(r".*avc: denied \{([^}]+)\}.*?scontext=([^ ]+).*?tcontext=([^ ]+).*", r"denied={\1} scontext=\2 tcontext=\3", line, flags=re.I)
                          avc_counts[key[:300]] += 1
                      if re.search(r"Fatal signal|SIGILL|SIGABRT|FATAL EXCEPTION|ANR in |Watchdog|Fatal error|not supported|unsupported instruction|Illegal instruction|cannot link executable|CANNOT LINK EXECUTABLE", line, re.I):
                          logcat_hits.append((name, i+1, line[:1000]))
              report += ["", "===== LOGCAT FATAL / NATIVE CRASH / ANR HITS (first 180) ====="]
              report.extend(f"{n}:{i}: {line}" for n, i, line in logcat_hits[:180])
              report += ["", "===== TOP AVC DENIAL SIGNATURES ====="]
              report.extend(f"{count}x {key}" for key, count in avc_counts.most_common(30))
              # Check kernel log for relevant failures, but only emit matching lines.
              kmsg = read("boot-1/kmsg.log")
              kmsg_hits = [(i+1, line[:1000]) for i, line in enumerate(kmsg.splitlines())
                           if re.search(r"i915|hwmon_device|gbos-stage0|kernel panic|BUG:|Oops:|unable to handle kernel|avc: denied|firmware.*(fail|missing)|failed to mount|I/O error", line, re.I)]
              report += ["", f"===== KMSG RELEVANT LINES ({len(kmsg_hits)} matches; first 160) ====="]
              report.extend(f"{i}: {line}" for i, line in kmsg_hits[:160])
          result = "\n".join(report)
          Path("boot-diagnostic-report.txt").write_text(result, errors="replace")
          print(result[:90000])
          print(f"\nREPORT_CHAR_COUNT={len(result)}")
          PY
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: boot-1-diagnostic-report
          path: boot-diagnostic-report.txt
          retention-days: 3
          if-no-files-found: error
