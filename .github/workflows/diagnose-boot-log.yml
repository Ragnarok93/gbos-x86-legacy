name: Diagnose first boot log
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-boot-log.yml"
      - "Logs/boot-1.zip"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract and analyze boot logs
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path

          archive = Path("Logs/boot-1.zip")
          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")
          out = Path("/tmp/boot-logs")
          out.mkdir(parents=True, exist_ok=True)
          report = []
          patterns = re.compile(
              r'avc:.*denied|\b(kernel panic|panic - not syncing|oops:|BUG:|Oops:|Call Trace:|'
              r'general protection fault|unable to handle kernel|segfault|fatal|'
              r'failed|failure|error|exception|watchdog|timeout|timed out|'
              r'permission denied|no such file|not found|I/O error|mount.*fail|'
              r'unsupported|incompatible|reboot|shutdown|killed process)\b',
              re.I
          )
          with zipfile.ZipFile(archive) as z:
              members = [i for i in z.infolist() if not i.is_dir()]
              report.append(f"ARCHIVE: {archive} ({archive.stat().st_size:,} bytes)")
              report.append(f"MEMBERS: {len(members)}")
              for info in members:
                  report.append(f"FILE: {info.filename} | {info.file_size:,} bytes")
              report.append("")
              text_files = []
              for info in members:
                  if info.file_size > 30_000_000:
                      report.append(f"SKIPPED oversized file: {info.filename}")
                      continue
                  try:
                      raw = z.read(info)
                      decoded = raw.decode("utf-8", errors="replace")
                  except Exception as e:
                      report.append(f"UNREADABLE: {info.filename}: {e}")
                      continue
                  # Save only text-like files in the runner workspace, never commit them.
                  if "\x00" in decoded[:4096]:
                      report.append(f"SKIPPED binary-looking file: {info.filename}")
                      continue
                  text_files.append((info.filename, decoded))
                  dest = out / Path(info.filename).name
                  dest.write_text(decoded, errors="replace")
              report.append("")
              report.append("=== TEXT FILE INVENTORY ===")
              for name, text in text_files:
                  lines = text.splitlines()
                  report.append(f"{name}: {len(lines):,} lines, {len(text):,} chars")
              report.append("")
              report.append("=== ERROR / FAILURE MATCHES WITH CONTEXT ===")
              total = 0
              for name, text in text_files:
                  lines = text.splitlines()
                  hits = [i for i, line in enumerate(lines) if patterns.search(line)]
                  if not hits:
                      continue
                  report.append(f"--- {name}: {len(hits)} matching lines ---")
                  selected = set()
                  for i in hits:
                      selected.update(range(max(0, i-2), min(len(lines), i+3)))
                  prev = -2
                  for i in sorted(selected):
                      if i > prev + 1:
                          report.append("...")
                      report.append(f"{i+1}: {lines[i][:1000]}")
                      prev = i
                      total += 1
                      if total >= 900:
                          report.append("TRUNCATED: reached 900 contextual lines.")
                          break
                  if total >= 900:
                      break
              if total == 0:
                  report.append("No matching error keywords found.")
              report.append("")
              report.append("=== END OF EACH TEXT FILE (last 60 lines, max 20,000 chars/file) ===")
              for name, text in text_files:
                  lines = text.splitlines()
                  if not lines:
                      continue
                  report.append(f"--- {name} ---")
                  tail = "\n".join(f"{max(1, len(lines)-59)+j}: {line[:1000]}" for j, line in enumerate(lines[-60:]))
                  report.append(tail[-20000:])
          result = "\n".join(report)
          Path("boot-diagnostic-report.txt").write_text(result, errors="replace")
          # Keep the job log useful if the report is large; artifact retains the complete report.
          print(result[:95000])
          print(f"\nREPORT_CHAR_COUNT={len(result)}")
          PY
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: boot-1-diagnostic-report
          path: boot-diagnostic-report.txt
          retention-days: 3
          if-no-files-found: error
