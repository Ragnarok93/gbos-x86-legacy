# gbOS86 boot options (shell syntax, edit on any computer)
# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none
# Load Intel graphics (i915: HD Graphics 4600 on the Latitude E6540, UHD 620 on the Latitude 5300). Set to 0 if it freezes.
LOAD_I915=1
# Load Intel Wi-Fi driver (firmware is not packaged yet, so it will likely complain)
LOAD_WIFI=0
# Seconds to pause before handing over to Android init (time to read the screen)
EXTRA_SLEEP=0
# MODE: what booting this USB does.
#   ask     show the gbOS86 menu: live / install-or-update / boot the installed system (default)
#   live    run gbOS86 live from the USB (nothing saved)
#   install go straight to the installer/updater (it asks before erasing anything)
#   boot    boot the installed system if there is one, else live
MODE=ask
# Display density (dpi). Unset = Google's stock 260 (too big here); lower = smaller. 180 suits this screen.
DENSITY=180
# Make everything smaller WITHOUT changing density: Android renders at this size and the display
# scales it to the 1920x1080 panel. Bigger = smaller UI (2400x1350 is ~20% smaller, 2880x1620 ~33%).
# Empty = native 1920x1080. Keep 16:9. Takes effect after an update boot.
RESOLUTION=

# Installer target: the internal NVMe or eMMC disk (SD cards and the stick are never targets). With more than one internal disk the
# installer refuses; name the one to erase here (e.g. nvme0n1 or mmcblk0). The serial number is still typed before anything is written.
#INSTALL_DISK=mmcblk0

# HWDETECT=1 (default): at boot, detect the laptop's hardware and load the matching drivers from gbos/modules with
# firmware from gbos/firmware (Wi-Fi, Bluetooth, sound, touchpad, hotkeys, brightness, ...). Report: logs/boot-N/hwdetect.txt.
# Set 0 for the original Latitude 5300 sequence (iwlmvm + btusb from the stick, no gbos/modules coldplug).
HWDETECT=1

# Keep performance-only replacement libraries disabled during boot. Bind mounts sourced from FAT inherit
# the vfat SELinux label; Android init switches to enforcing and panics when it reads system.libz.so.
# The kernel ISA emulator handles these instructions, so stock EROFS libraries are the safe boot-first path.
GBOS_DISABLE_PATCHED_LIBS=0
# The Conscrypt APEX overlay is deferred until its own correctly labeled image is packaged.
GBOS_DISABLE_APEX_PATCH=1

# Bind the SHA-NI/VNNI-free libz + libcrypto before stage0's dmctl runs (saves ~2 s of trapped SHA at boot).
# Harmless if the file is missing; hook.sh patches later anyway.
[ -f /gbos/gbos/early_patch.sh ] && . /gbos/gbos/early_patch.sh
